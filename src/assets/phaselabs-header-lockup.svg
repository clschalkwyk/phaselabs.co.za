<svg xmlns="http://www.w3.org/2000/svg"
     width="220" height="38" viewBox="0 0 220 38"
     role="img" aria-labelledby="title desc">
  <title id="title">PhaseLabs header logo</title>
  <desc id="desc">PhaseLabs pixel-to-stream icon with PHASE in white and LΛBS in cyan.</desc>

  <defs>
    <linearGradient id="phaselabsIconGradient" gradientUnits="userSpaceOnUse" x1="38" y1="150" x2="309" y2="150">
      <stop offset="0%" stop-color="#8B3DFF"/>
      <stop offset="45%" stop-color="#2E7BFF"/>
      <stop offset="100%" stop-color="#00E8F2"/>
    </linearGradient>
  </defs>

  <!-- Exact header icon: 38×38 CSS box, preserving original 360×300 viewBox -->
  <svg x="0" y="0" width="38" height="38" viewBox="0 0 360 300" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <g transform="translate(5 0)" fill="none">
      <g fill="url(#phaselabsIconGradient)">
        <rect x="38" y="119" width="10" height="10" rx="1.5"/>
        <rect x="62" y="93" width="12" height="12" rx="1.8"/>
        <rect x="66" y="140" width="9" height="9" rx="1.4"/>
        <rect x="84" y="112" width="11" height="11" rx="1.6"/>
        <rect x="92" y="153" width="12" height="12" rx="1.8"/>
        <rect x="110" y="81" width="10" height="10" rx="1.5"/>
        <rect x="112" y="127" width="12" height="12" rx="1.8"/>
        <rect x="122" y="166" width="9" height="9" rx="1.4"/>
        <rect x="137" y="101" width="13" height="13" rx="2"/>
        <rect x="142" y="142" width="10" height="10" rx="1.5"/>
        <rect x="158" y="124" width="12" height="12" rx="1.8"/>
      </g>
      <g stroke="url(#phaselabsIconGradient)" stroke-linecap="round" stroke-linejoin="round">
        <path d="M150 88 C190 88 208 90 229 111 C248 130 266 140 309 150" stroke-width="8"/>
        <path d="M164 119 C202 119 218 120 236 133 C252 144 270 148 309 150" stroke-width="7"/>
        <path d="M164 150 C202 150 226 150 309 150" stroke-width="7"/>
        <path d="M164 181 C202 181 218 180 236 167 C252 156 270 152 309 150" stroke-width="7"/>
        <path d="M150 212 C190 212 208 210 229 189 C248 170 266 160 309 150" stroke-width="8"/>
      </g>
    </g>
  </svg>

  <!-- Exact header wordmark rules from styles.css:
       gap:12px; font-size:17px; letter-spacing:.30em; weight:300;
       PHASE #F2F5F7; LΛBS #00E8F2; labs margin-left:.08em -->
  <text x="50" y="25.2"
        fill="#F2F5F7"
        font-family="'Avenir Next','Avenir','Helvetica Neue',Inter,Arial,sans-serif"
        font-size="17"
        font-weight="300"
        letter-spacing="5.1">
    <tspan>PHASE</tspan><tspan fill="#00E8F2" dx="1.36">LΛBS</tspan>
  </text>
</svg>
